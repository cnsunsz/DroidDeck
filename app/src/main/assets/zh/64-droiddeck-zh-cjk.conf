<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  DroidDeck 中文版: Simplified Chinese for the Linux runtime.
  Installed by the app (session/CjkFonts.kt) as /etc/fonts/conf.d/64-droiddeck-zh-cjk.conf, beside
  Noto Sans SC (SIL OFL 1.1) in /usr/local/share/fonts/droiddeck-zh. The runtime ships only DejaVu,
  which has no Han glyphs, so Steam's Chromium UI drew Chinese as boxes.
-->
<fontconfig>
  <!-- Chinese families pages and programs ask for by name: the bundled Noto Sans SC. -->
  <alias binding="same"><family>Noto Sans CJK SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Noto Sans CJK</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Noto Sans CJK TC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Noto Sans CJK JP</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Noto Sans SC Regular</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Source Han Sans SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Source Han Sans CN</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Source Han Sans</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei UI</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>PingFang SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Hiragino Sans GB</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Heiti SC</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>STHeiti</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>黑体</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>宋体</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>WenQuanYi Micro Hei</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>WenQuanYi Zen Hei</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <alias binding="same"><family>Droid Sans Fallback</family><prefer><family>Noto Sans SC</family></prefer></alias>
  <!-- The Latin and generic families Steam's UI and web pages name: Latin text keeps DejaVu (the runtime's
       own font), Han text falls through to Noto Sans SC. -->
  <alias binding="weak"><family>Motiva Sans</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Arial</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Helvetica</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Helvetica Neue</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Noto Sans</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>GoNotoKurrent</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>DejaVu Sans</family><accept><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Roboto</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Segoe UI</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Verdana</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Tahoma</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>sans-serif</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>sans</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>system-ui</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>ui-sans-serif</family><accept><family>DejaVu Sans</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>serif</family><accept><family>DejaVu Serif</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>DejaVu Serif</family><accept><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Times New Roman</family><accept><family>DejaVu Serif</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>monospace</family><accept><family>DejaVu Sans Mono</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>mono</family><accept><family>DejaVu Sans Mono</family><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>DejaVu Sans Mono</family><accept><family>Noto Sans SC</family></accept></alias>
  <alias binding="weak"><family>Courier New</family><accept><family>DejaVu Sans Mono</family><family>Noto Sans SC</family></accept></alias>
  <!-- Text tagged Chinese that asks for a generic family gets Noto Sans SC first. -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test qual="any" name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test qual="any" name="family"><string>monospace</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans SC</string></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>zh</string></test>
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="weak"><string>Noto Sans SC</string></edit>
  </match>
</fontconfig>
